<style>
:root{--navy:#14356B;--gold:#C8952A;--bg:#eef1f6;--card:#fff;--ink:#16233b;--line:#d8dee9;--wa:#25d366}
@media(prefers-color-scheme:dark){:root{--navy:#4e7bd1;--gold:#e0ac49;--bg:#0b1424;--card:#16233b;--ink:#eaf0fa;--line:#25344f}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding:22px 16px 32px}
.w{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.langs button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.03em;cursor:pointer}
.langs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
img{width:100%;border-radius:16px;box-shadow:0 20px 45px -25px rgba(20,53,107,.5);border:1px solid var(--line)}
h1{margin:0 0 4px;font-size:26px;text-align:center}
p.r{margin:0;text-align:center;color:var(--gold);font-weight:600}
.btns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.b,button.b{display:block;text-align:center;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer}
a.save,button.save{grid-column:1/-1;background:var(--navy);color:#fff;border:none}
a.wa{border-color:var(--wa)}
</style>
</head>

<div class="btns">
<button class="b save" id="s" type="button" data-i18n="save">Guardar contacto</button>

</div>
<script>
var T={
save:{es:"Guardar contacto",en:"Save contact",pt:"Salvar contato",fr:"Enregistrer le contact",de:"Kontakt speichern",it:"Salva contatto"},
call:{es:"Llamar",en:"Call",pt:"Ligar",fr:"Appeler",de:"Anrufen",it:"Chiama"},
email:{es:"Correo",en:"Email",pt:"E-mail",fr:"E-mail",de:"E-Mail",it:"Email"},
office:{es:"Oficina",en:"Office",pt:"Escritório",fr:"Bureau",de:"Büro",it:"Ufficio"}
};
function setLang(l){
document.querySelectorAll("[data-i18n]").forEach(function(e){var k=e.getAttribute("data-i18n");if(T[k]&&T[k][l])e.textContent=T[k][l];});
document.documentElement.lang=l;
document.querySelectorAll("#langs button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-lang")===l);});
try{localStorage.setItem("lang",l);}catch(e){}
}
document.querySelectorAll("#langs button").forEach(function(b){b.onclick=function(){setLang(b.getAttribute("data-lang"));};});
var saved=null;try{saved=localStorage.getItem("lang");}catch(e){}
var nav=(navigator.language||"es").slice(0,2);
var init=saved||(["es","en","pt","fr","de","it"].indexOf(nav)>=0?nav:"es");
setLang(init);
var v=["BEGIN:VCARD","VERSION:3.0","N:Toral;Jose Maria;;;","FN:Jose Maria Toral B.","ORG:Gondens International;Promtur Panama","TITLE:Vicepresidente comercial - Capitulo Centroamerica y Mexico","TEL;TYPE=CELL:+50766715086","EMAIL:jtoral@gondens.com","ADR;TYPE=WORK:;;Plaza 2000 Piso 14 Calle 50;Panama;;;Panama","URL:https://www.promturpanama.com","URL:https://www.visitpanama.com","URL:https://www.gondens.com","END:VCARD"].join("\r\n");

</script>
</body>
</html>
